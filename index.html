<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Carrefour casa</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f6f6f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:0 auto;padding:22px 16px 80px}h1{font-size:26px;margin:4px 0 5px}.subrow{display:flex;align-items:center;gap:8px;margin:0 0 18px}.sub{color:#6a6a66;font-size:14px}.ai{font-size:11px;padding:3px 7px;border-radius:999px;background:#ecece8;color:#666}.ai.on{background:#e8f3ea;color:#285a31}.composer,.panel,.reviewcard{background:#fff;border:1px solid #e5e5e1;border-radius:18px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}textarea{width:100%;border:0;resize:vertical;min-height:86px;font:inherit;font-size:16px;outline:none;color:#222}button,select,input{font:inherit}button{border:0;cursor:pointer}.primary{width:100%;background:#171717;color:#fff;padding:12px 16px;border-radius:12px;font-weight:650;margin-top:8px}.primary:disabled{opacity:.45}.secondary{width:100%;background:#efefeb;color:#222;padding:11px 14px;border-radius:12px;font-weight:600;margin-top:8px}.dangerBtn{background:#fff0f0;color:#8d2525}.result{display:none;background:#fff;border:1px solid #dfe6df;border-radius:14px;padding:13px 14px;margin-top:10px;font-size:13px;line-height:1.4}.result.show{display:block}.result-title{font-weight:700;margin-bottom:7px}.result ul{margin:0;padding-left:19px}.result li{margin:4px 0}.result .clarify{color:#8a5a00}.listhead{display:flex;align-items:center;justify-content:space-between;margin:25px 2px 10px}.listhead h2{font-size:18px;margin:0}.count,.refresh{font-size:13px;color:#777}.refresh{background:transparent}.items{display:flex;flex-direction:column;gap:9px}.item{background:#fff;border:1px solid #e5e5e1;border-radius:15px;padding:13px 14px;display:flex;gap:12px;align-items:flex-start}.grow{flex:1;min-width:0}.name{font-weight:700;font-size:15px;margin-bottom:5px}.meta,.price,.small{font-size:13px;color:#64645f;line-height:1.4}.price{color:#262626;margin-top:5px}.date{color:#8a8a84}.actions{display:flex;gap:5px;flex-direction:column}.ghost{background:#f1f1ee;border-radius:9px;padding:7px 9px;font-size:12px;color:#444}.danger{color:#9a3030}.badge{display:inline-block;background:#f2f2ef;border-radius:99px;padding:3px 7px;font-size:11px;margin-top:7px;color:#666}.empty{background:#fff;border:1px dashed #d6d6d0;border-radius:14px;padding:28px;text-align:center;color:#777}.hint{font-size:12px;color:#85857f;margin:8px 2px 0}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#202020;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;display:none;max-width:90vw;z-index:5}.setup{background:#fff7db;border:1px solid #ead99a;border-radius:14px;padding:14px;font-size:14px;margin-bottom:14px}.setup input{width:100%;margin-top:8px;padding:10px;border:1px solid #ccc;border-radius:9px}.shopbar{margin-top:16px}.shop{display:none;margin-top:26px}.shop.show{display:block}.shophead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}.shophead h2{font-size:20px;margin:0}.progress{font-size:13px;color:#777}.reviewcard .name{font-size:21px;margin-bottom:7px}.field{margin-top:16px}.field label{display:block;font-size:12px;color:#6c6c66;margin-bottom:6px}.field select,.field input[type=number]{width:100%;padding:11px;border:1px solid #d9d9d4;border-radius:11px;background:#fff}.check{display:flex;gap:9px;align-items:flex-start;margin-top:14px;font-size:14px}.check input{margin-top:2px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.twocol button{padding:12px;border-radius:12px;font-weight:650}.omit{background:#f0f0ed;color:#555}.approve{background:#171717;color:#fff}.summaryline{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;border-bottom:1px solid #eee}.summaryline:last-child{border-bottom:0}.execution{background:#eef5ef;border:1px solid #d7e7d9;border-radius:14px;padding:14px;margin-top:12px}.promptbox{display:none;margin-top:10px;background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px;font-size:12px;min-height:180px}.inlineLink{display:inline-block;margin-top:10px;color:#333;font-size:13px}.sep{height:1px;background:#e8e8e3;margin:16px 0}@media(min-width:640px){.wrap{padding-top:36px}.item{padding:15px 16px}}
</style>
</head>
<body><div class="wrap">
<h1>Carrefour casa</h1><div class="subrow"><span class="sub">Lista compartida para la próxima compra</span><span id="aistatus" class="ai">modo básico</span></div>
<div id="setup" class="setup" style="display:none">Falta la clave compartida. Pegala una vez y queda guardada sólo en este dispositivo.<input id="keyinput" placeholder="Clave"><button class="primary" id="savekey">Guardar clave</button></div>
<div class="composer"><textarea id="input" placeholder="Ej: Falta papel higiénico y avena. Para avena sólo Quaker o Morixe. Cambiá el detergente a Magistral 1,4 L."></textarea><button class="primary" id="apply">Aplicar cambios</button></div>
<div id="result" class="result"></div>
<div class="listhead"><h2>Lista activa</h2><div><span class="count" id="count"></span> <button class="refresh" id="refresh">Actualizar</button></div></div>
<div class="items" id="items"></div><div class="hint">Podés mandar varias instrucciones juntas. Si un producto ya existe, se deduplica.</div>
<div class="shopbar"><button id="startShop" class="primary">Armar compra</button></div>
<section id="shop" class="shop"><div class="sep"></div><div class="shophead"><div><h2 id="shopTitle">Revisar compra</h2><div id="shopSub" class="small"></div></div><div id="progress" class="progress"></div></div><div id="shopBody"></div></section>
</div><div class="toast" id="toast"></div>
<script>
const API='https://dspzighhijupnrfxvcwr.supabase.co/functions/v1/carrefour-casa-v2';const qs=new URLSearchParams(location.search);let KEY=qs.get('key')||localStorage.getItem('carrefourHouseholdKey')||'';if(qs.get('key')){localStorage.setItem('carrefourHouseholdKey',qs.get('key'));const clean=new URL(location.href);clean.searchParams.delete('key');history.replaceState({},'',clean.pathname+(clean.search||'')+clean.hash)}
const $=s=>document.querySelector(s);let rows=[],shopping=null;const authHeaders=()=>KEY?{'x-household-key':KEY}:{};
function fmt(n){return n==null?'':new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n))}function dateFmt(s){if(!s)return'';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y.slice(2)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function setup(){if(!KEY)$('#setup').style.display='block'}function authFailed(){KEY='';localStorage.removeItem('carrefourHouseholdKey');$('#setup').style.display='block';$('#items').innerHTML='<div class="empty">Ingresá la clave compartida para ver la lista.</div>'}
async function apiGet(q){const r=await fetch(API+q,{headers:authHeaders()});if(r.status===401){authFailed();throw new Error('Acceso no autorizado')}const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j}async function apiPost(body){const r=await fetch(API,{method:'POST',headers:{...authHeaders(),'content-type':'application/json'},body:JSON.stringify(body)});if(r.status===401){authFailed();throw new Error('Acceso no autorizado')}const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');return j}
async function loadStatus(){if(!KEY)return;try{const j=await apiGet('?api=status');const e=$('#aistatus');if(j.ai_enabled){e.textContent='IA activa';e.classList.add('on')}else{e.textContent='modo básico';e.classList.remove('on')}}catch(_){}}
async function load(){if(!KEY){setup();return}try{const j=await apiGet('');rows=j.items||[];render();await loadStatus();await loadSession()}catch(e){$('#items').innerHTML='<div class="empty">No pude cargar la lista.</div>'}}
function render(){$('#count').textContent=rows.length+' productos';const el=$('#items');if(!rows.length){el.innerHTML='<div class="empty">La lista está vacía.</div>';return}el.innerHTML=rows.map(x=>{const qty=Number(x.requested_quantity||1),detail=[x.brand,x.variant,x.size_text,qty!==1?'cantidad '+qty:null].filter(Boolean).join(' · ');return '<div class="item"><div class="grow"><div class="name">'+esc(x.canonical_name)+'</div><div class="meta">'+esc(detail||'Sin detalles registrados')+'</div><div class="price">'+(x.last_price?fmt(x.last_price):'Sin precio registrado')+(x.last_price_date?' <span class="date">· '+dateFmt(x.last_price_date)+'</span>':'')+'</div>'+(x.stockable?'<span class="badge">se puede stockear</span>':'')+'</div><div class="actions"><button class="ghost" onclick="prefill(\''+String(x.canonical_name).replace(/'/g,"\\'")+'\')">Cambiar</button><button class="ghost danger" onclick="removeItem(\''+String(x.canonical_name).replace(/'/g,"\\'")+'\')">Sacar</button></div></div>'}).join('')}
window.prefill=name=>{const i=$('#input');i.value='Cambiá '+name+' a ';i.focus();scrollTo({top:0,behavior:'smooth'})};window.removeItem=name=>{const i=$('#input');i.value='Sacá '+name;i.focus();scrollTo({top:0,behavior:'smooth'})};function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>e.style.display='none',3000)}
function actionText(x){if(x.type==='added')return'Agregué '+x.name+(x.detail?' ('+x.detail+')':'')+'.';if(x.type==='removed')return'Saqué '+x.name+' de la lista.';if(x.type==='changed')return'Actualicé '+x.name+(x.detail?' ('+x.detail+')':'')+'.';if(x.type==='remembered')return'Guardé una preferencia para '+x.name+(x.detail?': '+x.detail:'')+'.';if(x.type==='deduped')return x.name+' ya estaba en la lista, así que no lo dupliqué.';if(x.type==='clarify')return'Necesito aclaración: '+(x.detail||x.name)+'.';if(x.type==='not_found')return'No encontré '+(x.name||'ese producto')+' en la lista.';return'No pude confirmar una acción sobre '+(x.name||'la instrucción')+'.'}
function showResult(results){const el=$('#result');if(!results||!results.length){el.innerHTML='<div class="result-title">No hice cambios</div>';el.classList.add('show');return}el.innerHTML='<div class="result-title">Acciones realizadas</div><ul>'+results.map(x=>'<li class="'+(x.type==='clarify'?'clarify':'')+'">'+esc(actionText(x))+'</li>').join('')+'</ul>';el.classList.add('show')}
async function apply(){const raw=$('#input').value.trim();if(!raw||!KEY){if(!KEY)setup();return}const b=$('#apply');b.disabled=true;b.textContent='Aplicando…';$('#result').classList.remove('show');try{const j=await apiPost({action:'input',text:raw});$('#input').value='';showResult(j.results||[]);await load()}catch(e){toast(e.message||'No pude aplicar el cambio')}finally{b.disabled=false;b.textContent='Aplicar cambios'}}
async function loadSession(){if(!KEY)return;try{const j=await apiGet('?api=session');shopping=j.shopping||null;renderShopping()}catch(_){shopping=null;renderShopping()}}
function shopDetails(x){return [x.snapshot_brand,x.snapshot_variant,x.snapshot_size_text].filter(Boolean).join(' · ')||'Sin detalles registrados'}
function renderShopping(){const btn=$('#startShop'),sec=$('#shop'),body=$('#shopBody');if(!shopping){btn.textContent='Armar compra';sec.classList.remove('show');return}btn.textContent='Continuar compra';sec.classList.add('show');const s=shopping.session,items=shopping.items||[];const approved=items.filter(x=>x.decision==='approved').length,omitted=items.filter(x=>x.decision==='omitted').length,pending=items.filter(x=>x.decision==='pending');$('#progress').textContent=approved+' aprobados · '+omitted+' omitidos';if(s.status==='approving'){const x=pending[0];$('#shopTitle').textContent='Revisar compra';$('#shopSub').textContent=pending.length?pending.length+' por revisar':'Revisión completa';if(x){body.innerHTML='<div class="reviewcard"><div class="name">'+esc(x.canonical_name)+'</div><div class="meta">'+esc(shopDetails(x))+'</div><div class="price">'+(x.snapshot_last_price?'Último precio: '+fmt(x.snapshot_last_price)+(x.snapshot_last_price_date?' · '+dateFmt(x.snapshot_last_price_date):''):'Sin precio registrado')+'</div><div class="field"><label>Cantidad base</label><input id="reviewQty" type="number" min="0.1" step="1" value="'+Number(x.selected_quantity||1)+'"></div><div class="field"><label>Si no está disponible</label><select id="reviewPolicy"><option value="best_allowed"'+(x.substitution_policy==='best_allowed'?' selected':'')+'>Elegir la mejor alternativa permitida</option><option value="same_brand"'+(x.substitution_policy==='same_brand'?' selected':'')+'>Sólo misma marca</option><option value="ask"'+(x.substitution_policy==='ask'?' selected':'')+'>No sustituir sin consultar</option></select></div>'+(x.snapshot_stockable?'<label class="check"><input id="reviewStock" type="checkbox" '+(x.stock_up?'checked':'')+'><span>Puede comprar más si encuentra una oferta claramente conveniente</span></label>':'')+'<div class="twocol"><button class="omit" onclick="decideItem(\'omitted\')">Omitir</button><button class="approve" onclick="decideItem(\'approved\')">Aprobar</button></div></div><button class="secondary dangerBtn" onclick="discardSession()">Cancelar esta compra</button>'}else{body.innerHTML='<div class="panel"><div class="summaryline"><span>Aprobados</span><strong>'+approved+'</strong></div><div class="summaryline"><span>Omitidos</span><strong>'+omitted+'</strong></div><button class="primary" onclick="approveSession()">Confirmar selección</button><button class="secondary dangerBtn" onclick="discardSession()">Cancelar esta compra</button></div>'}}else if(['approved','cart_building','cart_ready'].includes(s.status)){$('#shopTitle').textContent='Compra aprobada';$('#shopSub').textContent=approved+' productos listos para ejecutar';body.innerHTML='<div class="execution"><strong>Preparar carrito en Carrefour</strong><div class="small" style="margin-top:6px">La instrucción permite sustituciones según las reglas aprobadas y obliga a detenerse antes de checkout.</div><button class="primary" onclick="copyExecutionPrompt()">Copiar instrucciones para ChatGPT</button><a class="secondary" style="display:block;text-align:center;text-decoration:none" target="_blank" href="https://www.carrefour.com.ar/">Abrir Carrefour</a><textarea id="promptBox" class="promptbox" readonly></textarea></div><button class="secondary dangerBtn" onclick="discardSession()">Cerrar esta sesión</button>'}}
window.decideItem=async decision=>{const x=(shopping.items||[]).find(i=>i.decision==='pending');if(!x)return;const policy=$('#reviewPolicy').value,qty=Number($('#reviewQty').value||1),stock=$('#reviewStock')?$('#reviewStock').checked:false;try{const j=await apiPost({action:'session_item',session_id:shopping.session.id,item_id:x.id,decision,substitution_policy:policy,selected_quantity:qty,stock_up:stock});shopping=j.shopping;renderShopping()}catch(e){toast(e.message)}};
window.approveSession=async()=>{try{const j=await apiPost({action:'session_approve',session_id:shopping.session.id});shopping=j.shopping;renderShopping()}catch(e){toast(e.message)}};
window.discardSession=async()=>{if(!shopping)return;try{await apiPost({action:'session_discard',session_id:shopping.session.id});shopping=null;renderShopping();toast('Sesión cerrada')}catch(e){toast(e.message)}};
window.copyExecutionPrompt=async()=>{try{const j=await apiGet('?api=manifest&session_id='+encodeURIComponent(shopping.session.id));const text=j.prompt;const box=$('#promptBox');box.value=text;try{await navigator.clipboard.writeText(text);toast('Instrucciones copiadas')}catch(_){box.style.display='block';box.focus();box.select();toast('Seleccioné el texto para copiarlo')}}catch(e){toast(e.message)}};
async function startShopping(){try{const j=await apiPost({action:'session_start'});shopping=j.shopping;renderShopping();$('#shop').scrollIntoView({behavior:'smooth',block:'start'})}catch(e){toast(e.message)}}
$('#apply').onclick=apply;$('#refresh').onclick=load;$('#startShop').onclick=startShopping;$('#savekey').onclick=()=>{KEY=$('#keyinput').value.trim();if(KEY){localStorage.setItem('carrefourHouseholdKey',KEY);$('#setup').style.display='none';load()}};$('#input').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')apply()});setup();load();setInterval(()=>{loadStatus();},30000);
</script></body></html>
