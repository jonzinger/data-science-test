<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Carrefour casa</title><style>:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#f6f6f4}*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:0 auto;padding:22px 16px 80px}h1{font-size:26px;margin:4px 0 5px}.sub{margin:0 0 18px;color:#6a6a66;font-size:14px}.composer{background:#fff;border:1px solid #e5e5e1;border-radius:18px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.03)}textarea{width:100%;border:0;resize:vertical;min-height:86px;font:inherit;font-size:16px;outline:none;color:#222}button{font:inherit;border:0;cursor:pointer}.primary{width:100%;background:#171717;color:#fff;padding:12px 16px;border-radius:12px;font-weight:650;margin-top:8px}.primary:disabled{opacity:.5}.listhead{display:flex;align-items:center;justify-content:space-between;margin:25px 2px 10px}.listhead h2{font-size:18px;margin:0}.count,.refresh{font-size:13px;color:#777}.refresh{background:transparent}.items{display:flex;flex-direction:column;gap:9px}.item{background:#fff;border:1px solid #e5e5e1;border-radius:15px;padding:13px 14px;display:flex;gap:12px;align-items:flex-start}.grow{flex:1;min-width:0}.name{font-weight:700;font-size:15px;margin-bottom:5px}.meta,.price{font-size:13px;color:#64645f;line-height:1.4}.price{color:#262626;margin-top:5px}.date{color:#8a8a84}.actions{display:flex;gap:5px;flex-direction:column}.ghost{background:#f1f1ee;border-radius:9px;padding:7px 9px;font-size:12px;color:#444}.danger{color:#9a3030}.badge{display:inline-block;background:#f2f2ef;border-radius:99px;padding:3px 7px;font-size:11px;margin-top:7px;color:#666}.empty{background:#fff;border:1px dashed #d6d6d0;border-radius:14px;padding:28px;text-align:center;color:#777}.hint{font-size:12px;color:#85857f;margin:8px 2px 0}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#202020;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;display:none;max-width:90vw;z-index:3}.setup{background:#fff7db;border:1px solid #ead99a;border-radius:14px;padding:14px;font-size:14px;margin-bottom:14px}.setup input{width:100%;margin-top:8px;padding:10px;border:1px solid #ccc;border-radius:9px} @media(min-width:640px){.wrap{padding-top:36px}.item{padding:15px 16px}}</style></head><body><div class="wrap"><h1>Carrefour casa</h1><p class="sub">Lista compartida para la próxima compra</p><div id="setup" class="setup" style="display:none">Falta la clave compartida. Pegala una vez y queda guardada en este dispositivo.<input id="keyinput" placeholder="Clave"><button class="primary" id="savekey">Guardar clave</button></div><div class="composer"><textarea id="input" placeholder="Ej: Falta papel higiénico y avena. Para avena sólo Quaker o Morixe. Cambiá el detergente a Magistral 1,4 L."></textarea><button class="primary" id="apply">Aplicar cambios</button></div><div class="listhead"><h2>Lista activa</h2><div><span class="count" id="count"></span> <button class="refresh" id="refresh">Actualizar</button></div></div><div class="items" id="items"></div><div class="hint">Podés mandar varias instrucciones juntas. Si un producto ya existe, se deduplica.</div></div><div class="toast" id="toast"></div><script>const API='https://dspzighhijupnrfxvcwr.supabase.co/functions/v1/carrefour-casa';const qs=new URLSearchParams(location.search);let KEY=qs.get('key')||localStorage.getItem('carrefourHouseholdKey')||'';if(qs.get('key'))localStorage.setItem('carrefourHouseholdKey',qs.get('key'));const $=s=>document.querySelector(s);let rows=[];function fmt(n){return n==null?'':new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(Number(n))}function dateFmt(s){if(!s)return'';const[y,m,d]=s.split('-');return d+'/'+m+'/'+y.slice(2)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function setup(){if(!KEY)$('#setup').style.display='block'}async function load(){if(!KEY){setup();return}try{const r=await fetch(API+'?key='+encodeURIComponent(KEY));if(!r.ok)throw new Error('No se pudo cargar');const j=await r.json();rows=j.items||[];render()}catch(e){$('#items').innerHTML='<div class="empty">No pude cargar la lista.</div>'}}function render(){$('#count').textContent=rows.length+' productos';const el=$('#items');if(!rows.length){el.innerHTML='<div class="empty">La lista está vacía.</div>';return}el.innerHTML=rows.map(x=>{const detail=[x.brand,x.variant,x.size_text].filter(Boolean).join(' · ');return '<div class="item"><div class="grow"><div class="name">'+esc(x.canonical_name)+'</div><div class="meta">'+esc(detail||'Sin detalles registrados')+'</div><div class="price">'+(x.last_price?fmt(x.last_price):'Sin precio registrado')+(x.last_price_date?' <span class="date">· '+dateFmt(x.last_price_date)+'</span>':'')+'</div>'+(x.stockable?'<span class="badge">se puede stockear</span>':'')+'</div><div class="actions"><button class="ghost" onclick="prefill(\''+String(x.canonical_name).replace(/'/g,"\\'")+'\')">Cambiar</button><button class="ghost danger" onclick="removeItem(\''+String(x.canonical_name).replace(/'/g,"\\'")+'\')">Sacar</button></div></div>'}).join('')}window.prefill=name=>{const i=$('#input');i.value='Cambiá '+name+' a ';i.focus();scrollTo({top:0,behavior:'smooth'})};window.removeItem=name=>{const i=$('#input');i.value='Sacá '+name;i.focus();scrollTo({top:0,behavior:'smooth'})};function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>e.style.display='none',2400)}async function apply(){const raw=$('#input').value.trim();if(!raw||!KEY)return;const b=$('#apply');b.disabled=true;b.textContent='Aplicando…';try{const r=await fetch(API+'?key='+encodeURIComponent(KEY),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'input',text:raw})});const j=await r.json();if(!r.ok)throw new Error(j.error||'Error');$('#input').value='';const msg=(j.results||[]).map(x=>x.type==='deduped'?'Ya estaba: '+x.name:x.type==='added'?'Agregado: '+x.name:x.type==='removed'?'Sacado: '+x.name:x.type==='changed'?'Actualizado: '+x.name+(x.detail?' · '+x.detail:''):x.type==='remembered'?'Recordado: '+x.name+(x.detail?' · '+x.detail:''):'No encontré: '+(x.name||'')).join(' · ');toast(msg||'Listo');await load()}catch(e){toast(e.message||'No pude aplicar el cambio')}finally{b.disabled=false;b.textContent='Aplicar cambios'}}$('#apply').onclick=apply;$('#refresh').onclick=load;$('#savekey').onclick=()=>{KEY=$('#keyinput').value.trim();if(KEY){localStorage.setItem('carrefourHouseholdKey',KEY);$('#setup').style.display='none';load()}};$('#input').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')apply()});setup();load();setInterval(load,15000);</script></body></html>
